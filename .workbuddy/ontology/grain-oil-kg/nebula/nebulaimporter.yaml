  csv:
    withHeader: true
    delimiter: ','
  edges:
  - name: kg_relation
    src:
      id:
        type: string
        index: 0
    dst:
      id:
        type: string
        index: 1
    rank:
      index: 2
    props:
    - name: relationId
      type: string
      index: 3
    - name: predicate
      type: string
      index: 4
    - name: confidence
      type: double
      index: 5
