- id: AGG-COMMODITY-001
  name: 品种
  alias: CmdCommodity
  aggregateType: AGGREGATE_ROOT
  description: 粮油品种主数据，含外部本体编码映射与父子品种层级
  lifecycle:
  - 有效
  - 停用
  tags:
  - 支撑域
  attributes:
  - name: commodityId
    label: 品种内部标识
    type: String
    required: true
    unique: true
    description: 系统生成 CMD+4 位流水
  - name: commodityCode
    label: 品种编码
    type: String
    required: true
    unique: true
    description: 人工录入业务编码，如 CMD-RICE
  - name: commodityName
    label: 品种名称
    type: String
    required: true
  - name: commodityCategory
    label: 品种类别
    type: DictionaryRef
    required: true
    dictionaryRef: Commodity.commodityCategory
  - name: scientificName
    label: 学名
    type: String
  - name: parentCommodityId
    label: 父品种
    type: AggregateRootRef
    targetAggregate: AGG-COMMODITY-001
  - name: conceptId
    label: 本体概念
    type: AggregateRootRef
    targetAggregate: AGG-CONCEPT-001
