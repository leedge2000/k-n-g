  - name: caliberNote
    label: 口径差异说明
    type: Text
  - name: sourceDocId
    label: 来源文档
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-SOURCE-001
  - name: segmentId
    label: 来源段落
    type: String
    required: true
  - name: knowledgeCategoryId
    label: 知识分类
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-TAXONOMY-001
  - name: industryStage
    label: 产业环节
    type: DictionaryRef
    dictionaryRef: Yearbook.industryStage
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: Yearbook.status
