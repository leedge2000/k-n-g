model_type: OBJECT
version: '2.1'
domain: 粮油产业多维知识图谱
description: 粮油产业多维知识图谱对象模型：15 个聚合根、4 个子实体、19 类数据字典；内部主键用于表主键与图 VID，业务编码独立用于检索
aggregates:
- id: AGG-SOURCE-001
  name: 来源文档
  alias: SourceDoc
  aggregateType: AGGREGATE_ROOT
  description: 承载四类知识的原始文档及其版本、校验与存储信息，是知识可回溯的根
  lifecycle:
  - 草稿
  - 有效
  - 已失效
  - 已作废
  tags:
  - 核心域
  attributes:
  - name: docId
    label: 文档编号
    type: String
    required: true
    unique: true
    description: 系统生成 SOU+4 位流水，作为内部主键与图节点 VID，不作为独立业务编码
  - name: title
    label: 文档标题
    type: String
    required: true
    description: 文档原标题
  - name: docType
    label: 文档类别
    type: DictionaryRef
    required: true
    dictionaryRef: SourceDoc.docType
  - name: issuer
    label: 发布机构
    type: String
    description: 发布或编制单位
  - name: publishDate
    label: 发布日期
    type: Date
  - name: docVersion
    label: 文档版本
    type: String
  - name: fileFormat
    label: 文件格式
    type: DictionaryRef
    dictionaryRef: SourceDoc.fileFormat
  - name: storageUri
    label: 存储地址
    type: String
    description: MinIO/对象存储 URI
  - name: checksum
    label: 校验码
    type: String
    description: 正文 SHA-256，用于 R-09 快照去重
  - name: language
    label: 语种
    type: DictionaryRef
    dictionaryRef: SourceDoc.language
  - name: pageCount
    label: 页数
    type: Integer
    refRules:
    - name: REF-05
      expression: value >= 0
      violationMessage: 页数不能为负
  - name: sourceUrl
    label: 来源链接
    type: String
    description: 采集或登记的原始 URL
  - name: crawlSourceId
    label: 采集源
    type: AggregateRootRef
    description: 由采集任务产生时回指采集源
    targetAggregate: AGG-CRAWL-001
  - name: knowledgeCategoryId
    label: 知识分类
    type: AggregateRootRef
    description: R-14：必须挂接有效分类且层级>=2
    targetAggregate: AGG-TAXONOMY-001
  - name: summary
    label: 摘要
    type: Text
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: SourceDoc.status
  entities:
  - name: 文档段落
    alias: Segment
    localId: segmentId
    description: 文档按标题/自然段切分后的可定位文本单元，是来源回溯的最小粒度
    cardinality: ONE_OR_MORE
    cascadeDelete: true
    attributes:
    - name: segmentId
      label: 段落编号
      type: String
      required: true
      unique: true
      description: 聚合内唯一，格式 SOU0001-S001
    - name: segmentNo
      label: 段落序号
      type: Integer
      required: true
    - name: pageNo
      label: 页码
      type: Integer
      refRules:
      - name: REF-07
        expression: value >= 0
        violationMessage: 页码不能为负
    - name: chapterPath
      label: 章节路径
      type: String
      description: 如 第三章/第一节
    - name: charStart
      label: 起始字符位置
      type: Integer
      required: true
      refRules:
      - name: REF-08
        expression: value >= 0
        violationMessage: 起始字符位置不能为负
    - name: charEnd
      label: 结束字符位置
      type: Integer
      required: true
      refRules:
      - name: REF-09
        expression: value > 0
        violationMessage: 结束字符位置必须大于 0
    - name: segmentText
      label: 段落文本
      type: Text
      required: true
    - name: segmentType
      label: 段落类型
      type: DictionaryRef
      dictionaryRef: Segment.segmentType
    - name: vectorId
      label: 向量索引标识
      type: String
      description: 向量库中的块 ID
  invariants:
  - name: INV-04 段落字符区间有效
    expression: all(segment.charEnd > segment.charStart for segment in Segment)
    violationMessage: 每个段落的结束位置必须大于起始位置
    enforcedAt: ON_CREATE
  - name: INV-05 来源文档至少包含一个段落
    expression: len(Segment) >= 1
    violationMessage: 有效来源文档必须至少切分出一个段落
    enforcedAt: ON_CREATE
- id: AGG-POLICY-001
  name: 政策法规
  alias: Policy
  aggregateType: AGGREGATE_ROOT
  description: 政策文件主体，关联发文机关、效力层级、时效与适用区域，下挂可执行条款
  lifecycle:
  - 草稿
  - 待审核
  - 已发布
  - 已退回
  - 已失效
  tags:
  - 核心域
  attributes:
  - name: policyId
    label: 政策编号
    type: String
    required: true
    unique: true
    description: 系统生成 POL+4 位流水
  - name: policyTitle
    label: 政策标题
    type: String
    required: true
  - name: docNumber
    label: 发文字号
    type: String
    description: 如 国办发〔2025〕1 号
  - name: policyLevel
    label: 效力层级
    type: DictionaryRef
    required: true
    dictionaryRef: Policy.policyLevel
  - name: issuer
    label: 发文机关
    type: String
    required: true
  - name: effectiveDate
    label: 生效日期
    type: Date
  - name: expireDate
    label: 失效日期
    type: Date
  - name: policyStatus
    label: 政策时效状态
    type: DictionaryRef
    required: true
    dictionaryRef: Policy.policyStatus
  - name: regionId
    label: 适用地区
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-REGION-001
  - name: sourceDocId
    label: 来源文档
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-SOURCE-001
  - name: segmentId
    label: 来源段落
    type: String
    description: 来源文档段落编号
  - name: knowledgeCategoryId
    label: 知识分类
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-TAXONOMY-001
  - name: industryStage
    label: 产业环节
    type: DictionaryRef
    required: true
    dictionaryRef: Policy.industryStage
  - name: factorDimensions
    label: 要素维度
    type: String
    description: 多值逗号分隔：供给,需求,库存,贸易,价格,成本,收益
  - name: reviewStatus
    label: 审核状态
    type: DictionaryRef
    required: true
    dictionaryRef: Policy.reviewStatus
  - name: summary
    label: 政策要点摘要
    type: Text
  entities:
  - name: 政策条款
    alias: Clause
    localId: clauseId
    description: 政策文件中的可执行条款单元
    cardinality: ONE_OR_MORE
    cascadeDelete: true
    attributes:
    - name: clauseId
      label: 条款编号
      type: String
      required: true
      unique: true
      description: 格式 POL0001-C001
    - name: clauseNo
      label: 条款序号
      type: Integer
      required: true
    - name: clauseTitle
      label: 条款标题
      type: String
    - name: clauseText
      label: 条款正文
      type: Text
      required: true
    - name: measureType
      label: 措施类型
      type: DictionaryRef
      dictionaryRef: Clause.measureType
    - name: targetObject
      label: 作用对象
      type: String
      description: 品种/地区/企业等
    - name: clauseEffectiveDate
      label: 条款生效日期
      type: Date
  invariants:
  - name: INV-01 政策时效区间有效
    expression: effectiveDate is None or expireDate is None or effectiveDate <= expireDate
    violationMessage: 生效日期不得晚于失效日期
    enforcedAt: ALWAYS
- id: AGG-INDICATOR-001
  name: 指标定义
  alias: Indicator
  aggregateType: AGGREGATE_ROOT
  description: 粮油经济指标的口径、单位、频率与来源，是指标数据的元数据主数据
  lifecycle:
  - 有效
  - 停用
  tags:
  - 支撑域
  attributes:
  - name: indicatorId
    label: 指标内部标识
    type: String
    required: true
    unique: true
    description: 系统生成 IND+4 位流水
  - name: indicatorCode
    label: 指标编码
    type: String
    required: true
    unique: true
    description: 人工录入业务编码，如 AE-YIELD-001
  - name: indicatorName
    label: 指标名称
    type: String
    required: true
  - name: indicatorCategory
    label: 指标类别
    type: DictionaryRef
    required: true
    dictionaryRef: Indicator.indicatorCategory
  - name: unit
    label: 计量单位
    type: String
    required: true
    description: 万吨/元每吨/公顷等
  - name: frequency
    label: 统计频率
    type: DictionaryRef
    required: true
    dictionaryRef: Indicator.frequency
  - name: caliber
    label: 统计口径说明
    type: Text
  - name: sourceOrg
    label: 口径来源机构
    type: String
  - name: knowledgeCategoryId
    label: 知识分类
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-TAXONOMY-001
  - name: industryStage
    label: 产业环节
    type: DictionaryRef
    required: true
    dictionaryRef: Indicator.industryStage
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: Indicator.status
- id: AGG-INDVAL-001
  name: 指标数据
  alias: IvdData
  aggregateType: AGGREGATE_ROOT
  description: 指标在地区、品种、期间上的取值，是供需用分析的核心事实数据
  lifecycle:
  - 草稿
  - 待审核
  - 已发布
  - 已退回
  - 已失效
  tags:
  - 核心域
  attributes:
  - name: valueId
    label: 数据编号
    type: String
    required: true
    unique: true
    description: 系统生成 IVD+4 位流水
  - name: indicatorId
    label: 指标定义
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-INDICATOR-001
  - name: regionId
    label: 地区
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-REGION-001
  - name: commodityId
    label: 品种
    type: AggregateRootRef
    targetAggregate: AGG-COMMODITY-001
  - name: periodType
    label: 期间类型
    type: DictionaryRef
    required: true
    dictionaryRef: IvdData.periodType
  - name: period
    label: 期间
    type: String
    required: true
    description: 2025 / 2025Q1 / 2025-06 / 2025-06-30
  - name: value
    label: 数值
    type: Decimal
    required: true
    refRules:
    - name: REF-02
      expression: value >= -1000000000 and value <= 1000000000
      violationMessage: 指标数值超出允许范围
  - name: unit
    label: 计量单位
    type: String
  - name: qualityFlag
    label: 数据质量标识
    type: DictionaryRef
    required: true
    dictionaryRef: IvdData.qualityFlag
  - name: sourceDocId
    label: 来源文档
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-SOURCE-001
  - name: segmentId
    label: 来源段落
    type: String
    required: true
    description: 来源文档段落编号，支撑段落级回溯
  - name: knowledgeCategoryId
    label: 知识分类
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-TAXONOMY-001
  - name: industryStage
    label: 产业环节
    type: DictionaryRef
    required: true
    dictionaryRef: IvdData.industryStage
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: IvdData.status
  - name: remark
    label: 备注
    type: String
  invariants:
  - name: INV-06 指标四维业务键完整
    expression: indicatorId is not None and regionId is not None and period is not None
    violationMessage: 指标、地区与期间必须完整；四维唯一性由 R-02 跨记录检测
    enforcedAt: ON_CREATE
