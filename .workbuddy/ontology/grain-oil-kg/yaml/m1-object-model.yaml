    type: String
  - name: handleStatus
    label: 处置状态
    type: DictionaryRef
    required: true
    dictionaryRef: QisRecord.handleStatus
  - name: handleRemark
    label: 处置说明
    type: Text
  - name: handler
    label: 处置人
    type: String
  - name: handledAt
    label: 处置时间
