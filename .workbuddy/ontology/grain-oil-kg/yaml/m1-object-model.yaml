  attributes:
  - name: issueId
    label: 治理记录编号
    type: String
    required: true
    unique: true
    description: 系统生成 QIS+4 位流水
  - name: issueType
    label: 问题类型
    type: DictionaryRef
    required: true
    dictionaryRef: QisRecord.issueType
  - name: primaryEntityType
    label: 主实体类型
    type: DictionaryRef
    required: true
    dictionaryRef: QisRecord.primaryEntityType
  - name: primaryEntityId
    label: 主实体编号
    type: String
    required: true
  - name: duplicateEntityId
    label: 重复/对照实体编号
    type: String
  - name: similarity
    label: 相似度
    type: Decimal
    refRules:
