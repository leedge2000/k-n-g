- id: AGG-CRAWL-001
  name: 采集源
  alias: CrsSource
  aggregateType: AGGREGATE_ROOT
  description: 面向公开情报页面的采集配置、调度策略与安全约束
  lifecycle:
  - 启用
  - 暂停
  - 已作废
  tags:
  - 核心域
  attributes:
  - name: crawlSourceId
    label: 采集源编号
    type: String
    required: true
    unique: true
    description: 系统生成 CRS+4 位流水
  - name: sourceName
    label: 采集源名称
    type: String
    required: true
  - name: sourceUrl
    label: 入口地址
    type: String
    required: true
    description: 仅允许 http/https，R-11 校验
  - name: sourceType
    label: 源类型
    type: DictionaryRef
    required: true
    dictionaryRef: CrsSource.sourceType
  - name: contentCategory
    label: 内容归口
    type: DictionaryRef
    required: true
    dictionaryRef: CrsSource.contentCategory
  - name: crawlMode
    label: 采集方式
    type: DictionaryRef
    required: true
    dictionaryRef: CrsSource.crawlMode
  - name: cronExpr
    label: 调度表达式
    type: String
    description: 定时采集的 cron 表达式
  - name: charset
    label: 字符集
    type: DictionaryRef
    dictionaryRef: CrsSource.charset
  - name: requestHeaders
    label: 请求头
    type: String
    description: UA 等，JSON 字符串
  - name: minIntervalMinutes
    label: 最小抓取间隔(分钟)
    type: Integer
    required: true
    defaultValue: 60
    refRules:
    - name: REF-10
      expression: value >= 1
      violationMessage: 抓取间隔不得小于 1 分钟
  - name: maxRetry
    label: 最大重试次数
    type: Integer
    defaultValue: 3
  - name: knowledgeCategoryId
    label: 默认知识分类
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-TAXONOMY-001
  - name: enabledFlag
    label: 启停状态
    type: DictionaryRef
    required: true
    dictionaryRef: CrsSource.enabledFlag
  - name: lastRunAt
    label: 最近执行时间
    type: DateTime
  entities:
  - name: 采集执行记录
    alias: CrawlRun
    localId: runId
    description: 单次采集运行的起止时间、状态、抓取量与错误信息
    cardinality: ZERO_OR_MORE
    cascadeDelete: true
    attributes:
    - name: runId
      label: 执行编号
      type: String
      required: true
      unique: true
    - name: startedAt
      label: 开始时间
      type: DateTime
      required: true
    - name: finishedAt
      label: 结束时间
      type: DateTime
    - name: runStatus
      label: 执行状态
      type: DictionaryRef
      required: true
      dictionaryRef: CrawlRun.runStatus
    - name: httpStatus
      label: HTTP 状态码
      type: Integer
    - name: fetchedCount
      label: 抓取条数
      type: Integer
    - name: savedCount
      label: 入库条数
      type: Integer
    - name: newDocCount
      label: 新增文档数
      type: Integer
      required: true
      defaultValue: 0
    - name: duplicateCount
      label: 去重跳过数
      type: Integer
      required: true
      defaultValue: 0
    - name: durationMs
      label: 执行耗时毫秒
      type: Integer
      description: 由 finishedAt-startedAt 计算，未完成时为空
    - name: errorMessage
      label: 错误信息
      type: Text
- id: AGG-TAXONOMY-001
  name: 知识分类
  alias: KtcCategory
  aggregateType: AGGREGATE_ROOT
  description: 四类知识的主分类树节点，叠加产业环节与要素维度，构成三轴知识体系
  lifecycle:
  - 有效
  - 停用
  tags:
  - 支撑域
  attributes:
  - name: categoryId
    label: 分类内部标识
    type: String
    required: true
    unique: true
    description: 系统生成 KTC+4 位流水
  - name: categoryCode
    label: 分类编码
    type: String
    required: true
    unique: true
    description: 层级编码，如 AE-01-01
  - name: categoryName
    label: 分类名称
    type: String
    required: true
  - name: parentCategoryId
    label: 父分类
    type: AggregateRootRef
    targetAggregate: AGG-TAXONOMY-001
  - name: level
    label: 层级
    type: Integer
    required: true
    refRules:
    - name: REF-11
      expression: value >= 1 and value <= 4
      violationMessage: 分类层级必须在 1~4 之间
  - name: categoryPath
    label: 分类路径
    type: String
    description: 农业经济/粮食生产经济/粮食播种面积
  - name: rootCategory
    label: 归属大类
    type: DictionaryRef
    required: true
    dictionaryRef: KtcCategory.rootCategory
  - name: industryStage
    label: 默认产业环节
    type: DictionaryRef
    required: true
    dictionaryRef: KtcCategory.industryStage
  - name: factorDimensions
    label: 默认要素维度
    type: String
    description: 多值逗号分隔：供给,需求,库存,贸易,价格,成本,收益
  - name: definition
    label: 分类定义
    type: Text
  - name: keywords
    label: 关键词
    type: String
    description: 分号分隔
  - name: sortNo
    label: 排序号
    type: Integer
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: KtcCategory.status
  invariants:
  - name: R-13 分类局部层级与路径约束
    expression: ((parentCategoryId is None and level == 1) or (parentCategoryId is not None and parentCategoryId != categoryId and level >= 2)) and categoryPath is not None
    violationMessage: 根节点必须为一级；非根节点不得自引用且层级至少为二级；完整父链与无环校验由 R-13 执行
    enforcedAt: ALWAYS
