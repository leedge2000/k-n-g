  - name: regionId
    label: 所在地区
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-REGION-001
  - name: scale
    label: 企业规模
    type: DictionaryRef
    dictionaryRef: Enterprise.scale
  - name: legalPerson
    label: 法定代表人
    type: String
  - name: address
    label: 注册地址
    type: String
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: Enterprise.status
- id: AGG-CONCEPT-001
  name: 本体概念
  alias: Concept
  aggregateType: AGGREGATE_ROOT
  description: FoodOn/AGROVOC/DFC/KGAP 等外部本体的概念映射与本地同义词集合
  lifecycle:
  - 有效
  - 停用
  tags:
  - 支撑域
  attributes:
  - name: conceptId
    label: 概念内部标识
    type: String
    required: true
    unique: true
    description: 系统生成 CON+4 位流水
  - name: conceptCode
    label: 概念编码
    type: String
    required: true
    unique: true
    description: 人工录入，如 FOODON-00001234
  - name: conceptName
    label: 概念名称
    type: String
    required: true
  - name: conceptType
    label: 概念类型
    type: DictionaryRef
    required: true
    dictionaryRef: Concept.conceptType
  - name: sourceOntology
    label: 来源本体
    type: DictionaryRef
    required: true
    dictionaryRef: Concept.sourceOntology
  - name: externalUri
    label: 外部概念 URI
    type: String
  - name: parentConceptId
    label: 父概念
    type: AggregateRootRef
    targetAggregate: AGG-CONCEPT-001
  - name: definition
    label: 概念定义
    type: Text
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: Concept.status
  entities:
  - name: 同义词
    alias: Synonym
    localId: synonymId
    description: 概念的简称、别名、外文名与常见错拼
    cardinality: ZERO_OR_MORE
    cascadeDelete: true
    attributes:
    - name: synonymId
      label: 同义词编号
      type: String
      required: true
      unique: true
    - name: synonymName
      label: 同义词
      type: String
      required: true
    - name: language
      label: 语种
      type: DictionaryRef
      dictionaryRef: Synonym.language
    - name: synonymType
      label: 同义词类型
      type: DictionaryRef
      required: true
      dictionaryRef: Synonym.synonymType
  invariants:
  - name: INV-03 概念不得自引用为父概念
    expression: parentConceptId is None or parentConceptId != conceptId
    violationMessage: 父概念不能是自身
    enforcedAt: ALWAYS
- id: AGG-RELATION-001
  name: 知识关系
  alias: Relation
  aggregateType: AGGREGATE_ROOT
  description: 知识实体间的多态三元组，含来源、置信度与有效期间，是图谱边的事实来源
  lifecycle:
  - 草稿
  - 待审核
  - 已发布
  - 已退回
  - 已失效
  tags:
  - 核心域
  attributes:
  - name: relationId
    label: 关系编号
    type: String
    required: true
    unique: true
    description: 系统生成 REL+4 位流水
  - name: subjectEntityType
    label: 主体实体类型
    type: DictionaryRef
    required: true
    dictionaryRef: Relation.subjectEntityType
  - name: subjectEntityId
    label: 主体实体编号
    type: String
    required: true
  - name: predicate
    label: 关系谓词
    type: DictionaryRef
    required: true
    dictionaryRef: Relation.predicate
  - name: objectEntityType
    label: 客体实体类型
    type: DictionaryRef
    required: true
    dictionaryRef: Relation.objectEntityType
  - name: objectEntityId
    label: 客体实体编号
    type: String
    required: true
  - name: confidence
    label: 置信度
    type: Decimal
    required: true
    refRules:
    - name: REF-01
      expression: value >= 0 and value <= 1
      violationMessage: 置信度必须在 0~1 之间
  - name: sourceDocId
    label: 来源文档
    type: AggregateRootRef
    required: true
    targetAggregate: AGG-SOURCE-001
  - name: segmentId
    label: 来源段落
    type: String
    required: true
  - name: extractedBy
    label: 抽取方式
    type: DictionaryRef
    required: true
    dictionaryRef: Relation.extractedBy
  - name: validFrom
    label: 生效日期
    type: Date
  - name: validTo
    label: 失效日期
    type: Date
  - name: status
    label: 状态
    type: DictionaryRef
    required: true
    dictionaryRef: Relation.status
  invariants:
  - name: INV-02 关系主体与客体不能相同
    expression: subjectEntityType != objectEntityType or subjectEntityId != objectEntityId
    violationMessage: 关系主体与客体不能是同一实体
    enforcedAt: ALWAYS
- id: AGG-QUALITY-001
  name: 质量治理记录
  alias: QisRecord
  aggregateType: AGGREGATE_ROOT
  description: 重复、冲突、缺失与失效来源的检测与处置记录
