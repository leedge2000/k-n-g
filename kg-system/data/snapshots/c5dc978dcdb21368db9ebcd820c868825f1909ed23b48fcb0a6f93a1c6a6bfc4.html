<html lang="zh">
<head>
    <meta charset="UTF-8">

    <style>
        .container {
            width: 100%;
            max-width: 588px;
            margin: 0 auto;
            background-color: white;
        }

        .header {
            border: 2px solid #d32f2f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #d32f2f;
            color: white;
            height: 50px;
            width: 100%;
        }
        .header .title {
            width: 60%;
            font-size: 20px;
        }

        .header .value {
            width: 40%;
        }

        .header div {
            line-height: 50px;
            height: 100%;
            font-weight: 600;
            text-align: center;
        }
        .lycp_title {
            border: 2px solid #ff9800;
            width: 40%;
            height: 100%;
            line-height: 40px;
            text-align: center;
        }

        .clz_title {
            height: 26px;
            font-weight: 500;
            font-size: 16px;
        }
        .font_green {
            color: #4caf50;
        }
        .font_orange {
            color: orange;
        }

        .three_level_top {
            margin-left: 33%;
            border-left: 2px solid #4caf50;
            width: 50%;
            border-right: 2px solid orange;
            height: 25px;
            margin-top: 4px;
        }

        .three_level {
            display: flex;
            gap: 2px;
            text-align: center
        }

        .three_level_sub {
            height: 190px;
            border: 1px solid #d0d0d0;
            width: 99px;
        }
        .three_level_sub img {
            margin-top: 20px;
            width: 40px;
            height: 40px;
        }

        .three_level_sub .title {
            color: #5e5e5e;
            font-size: 14px;
        }

        .three_level_sub .value {
            font-weight: 500;
            height: 30px;
            line-height: 30px;
            font-size: 18px;
        }
        .arrow-up {
            background-color: #fb5347;
            width: 70px;
            border-radius: 5px;
            background-image: url('./images/dataChannel/trend_up1.gif');
            background-repeat: no-repeat;
            background-position-y: center;
            color: white;
            height: 25px;
            text-indent: 20px;
            line-height: 25px;
            margin: 0 auto;
            font-size: 18px;
        }

        .arrow-down {
            background-color: #6ce937;
            width: 70px;
            border-radius: 5px;
            background-image: url('./images/dataChannel/trend_down1.gif');
            background-repeat: no-repeat;
            background-position-y: center;
            color: white;
            height: 25px;
            text-indent: 20px;
            line-height: 25px;
            margin: 0 auto;
            font-size: 18px;
        }

        .arrow-up_none_bg {
            width: 50px;
            background-image: url('./images/dataChannel/trend_up.gif');
            background-repeat: no-repeat;
            background-position-y: center;
            color: red;
            text-indent: 20px;
            font-size: 18px;
        }

        .arrow-down_none_bg {
            width: 50px;
            background-image: url('./images/dataChannel/trend_down.gif');
            background-repeat: no-repeat;
            background-position-y: center;
            color: #00A62D;
            text-indent: 20px;
            font-size: 18px;
        }

        .border_t {
            border-top: 2px solid #4caf50;
        }

        .border_trl {
            border-top: 2px solid #4caf50;
            border-right: 2px solid #4caf50;
            border-left: 2px solid #4caf50;
        }

        .border_trl_orange {
            border-top: 2px solid orange;
            border-right: 2px solid orange;
            border-left: 2px solid orange;
        }

        .green {
            border: 2px solid #4caf50;
        }

        .orange {
            border: 2px solid orange;
        }

        .left_node {
            height: 25px;
            width: 92px;
        }

        .level3 {
            display: flex;
            margin-left: 9%
        }

        .right_node {
            height: 25px;
            width: 94px;
            margin-left: 18%;
        }

        .ncpzs {
            display: flex;
            background-color: white;
            justify-content: center;

        }

        .zsValue {
            color: black;
            font-size: 18px;
        }

        .line1 {
            margin-left: 10%;
            height: 25px;
            border-right: 2px solid #d0d0d0;
            width: 50%;
        }

        .line1-1 {
            height: 25px;
            border-top: 2px solid #d0d0d0;
            border-left: 2px solid #d0d0d0;
            border-right: 2px solid #d0d0d0;
            width: 50%;
            margin-left: 33%;
        }

        .two_level {
            width: 100%;
            display: flex;
            gap: 2px;
            height: 60px;
        }
        .clz_div {
            border: 2px solid #4caf50;
            width: 81%;
            height: 100%;
            line-height: 40px;
            text-align: center;
        }
        .clz_value {
            display: inline-flex;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
        }

        .maxDate {
            padding: 0 20px 10px 0;
            font-weight: 600;
            height: 22px;
            font-size: 18px;
        }
    </style>

<script type="text/javascript">
    $(function () {
            let maxDate = '', result = []
            let map = {
                "水产品价格指数": 'scp', "蔬菜价格指数": 'sc', "水果价格指数": 'sg',
                "粮食价格指数": "ls", "畜产品价格指数": "xcp", "粮油产品批发价格指数": "ly",
                "“菜篮子”产品批发价格指数": "clz", "农产品批发价格200指数": "ncp", "食用油价格指数": "syy"
            }

            function getData() {
                var basePath = '/nyb';
                $.ajax({
                    url: basePath + '/200zs',
                    type: 'get',
                    dataType: 'json'
                }).done(coverData)
            }

            // 创建一个对象来存储每个指标的值
            function coverData(data) {

                let items = data[1]
                let values = data[2]
                maxDate = data[0][0]
                let itemValues = {}

                // 遍历数据，将相同指标的数据分组
                for (let i = 0; i < items.length; i++) {
                    let itemName = items[i]
                    let value = parseFloat(values[i])
                    if (!itemValues[itemName]) {
                        itemValues[itemName] = []
                    }
                    itemValues[itemName].push(value)
                }

                // 构建结果对象
                for (let itemName in itemValues) {
                    let shortName = map[itemName]
                    if (shortName) {
                        let valuesArray = itemValues[itemName]
                        let currentValue = valuesArray[0]
                        let previousValue = valuesArray.length > 1 ? valuesArray[1] : currentValue
                        let tb = (currentValue - previousValue).toFixed(2)

                        let itemObj = {}
                        itemObj[shortName] = {
                            value: currentValue.toFixed(2),
                            tb: tb
                        }
                        result.push(itemObj)
                    }
                }
                updatePageValues(maxDate, result)
            }

            getData()

            // 更新页面中的数值
            function updatePageValues(maxDate, result) {
                $('.maxDate').text(maxDate)
                result.forEach(item => {
                    // 获取键名（如 'scp', 'sc' 等）
                    const key = Object.keys(item)[0];
                    const data = item[key];

                    // 更新数值
                    if ($('.' + key).length > 0) {
                        $('.' + key).text(data.value);
                    }
                    // 更新箭头和变化值
                    if ($('.' + key + 'tb').length > 0) {
                        const tbElement = $('.' + key + 'tb');
                        tbElement.text(data.tb);
                        if (data.tb > 0) {
                            tbElement.text('+' + data.tb);
                        } else if (data.tb < 0) {
                            tbElement.text(data.tb);
                        } else {
                            tbElement.text('');
                        }
                        // 根据变化值正负设置箭头样式
                        if (parseFloat(data.tb) > 0) {
                            // 正数使用向上箭头样式
                            if (key === 'ncp' || key === 'clz' || key === 'ly') {
                                tbElement.addClass('arrow-up_none_bg');
                            } else {
                                tbElement.addClass('arrow-up')
                            }

                        } else if (data.tb < 0) {
                            // 负数使用向下箭头样式
                            if (key === 'ncp' || key === 'clz' || key === 'ly') {
                                tbElement.addClass('arrow-down_none_bg');
                            } else {
                                tbElement.addClass('arrow-down');
                            }
                        } else {
                            tbElement.removeClass('arrow-down arrow-down_none_bg arrow-up arrow-up_none_bg')
                        }
                    }
                });
            }
        }
    )
</script>
